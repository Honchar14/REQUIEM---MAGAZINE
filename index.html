<!doctype html>
<html lang="en" class="is-loading is-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>REQUIEM — Magazine</title>
    <meta name="description" content="Culture, filed under evidence. An independent magazine about fashion, music, art and the people who make them strange." />
    <meta name="theme-color" content="#0b0b0a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Special Elite (Apache 2.0), self-hosted: no extra connections before the first letter -->
    <link rel="preload" href="/fonts/special-elite-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- the first photos of the loading stack -->
    <link rel="preload" href="/media/news/01.webp" as="image" type="image/webp" />
    <link rel="preload" href="/media/news/02.webp" as="image" type="image/webp" />
  </head>
  <body>
    <!-- motion blur filters for the preloader photo stack -->
    <svg class="sr-filters" width="0" height="0" aria-hidden="true">
      <defs>
        <filter id="mblur-0" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="0 0" /></filter>
        <filter id="mblur-1" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="0 0" /></filter>
        <filter id="mblur-2" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="0 0" /></filter>
        <filter id="mblur-3" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="0 0" /></filter>
        <filter id="mblur-4" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur stdDeviation="0 0" /></filter>
        <!-- the pager ring as it jumps between pages -->
        <filter id="mblur-ring" x="-100%" y="-20%" width="300%" height="140%"><feGaussianBlur stdDeviation="0 0" /></filter>
      </defs>
    </svg>

    <main class="stage" data-stage>
      <!-- background: texture + faint flickering type -->
      <div class="bg" data-bg>
        <div class="bg__tex"></div>
        <div class="bg__cols" data-bg-cols></div>
      </div>

      <!-- news photos: stack while loading, row on the main screen -->
      <div class="photos" data-photos></div>

      <!-- grid lines (drawn on exit), above the photos as in the layout -->
      <div class="lines" data-lines aria-hidden="true"></div>

      <!-- wordmark: R and M live through the whole preloader -->
      <h1 class="wordmark" aria-label="REQUIEM">
        <svg viewBox="0 0 1860 352" fill="none" xmlns="http://www.w3.org/2000/svg" data-wordmark>

        </svg>
      </h1>

      <!-- main screen UI -->
      <div class="ui" data-ui>
        <p class="t" style="--x:30;--b:418" data-flicker data-i18n="underWatch">Under Watch: 2026</p>

        <nav class="ui__nav" aria-label="Sections">
          <a class="t" href="#" style="--x:1213;--b:418">Fashion</a>
          <a class="t" href="#" style="--x:1301;--b:418">Music</a>
          <a class="t" href="#" style="--x:1371;--b:418">Art &amp; Photography</a>
          <a class="t" href="#" style="--x:1544;--b:418">Film &amp; TV</a>
          <a class="t" href="#" style="--x:1645;--b:418">Culture</a>
        </nav>

        <!-- language: EN / ES (the globe toggles); the label flicks on instead of being typed -->
        <div class="grp ui__lang" role="group" aria-label="Language" style="--r:30;--y:405;--w:81;--h:14">
          <img class="ico" style="--ix:0;--iy:0;--iw:14;--ih:14" src="/media/icons/globe.svg" alt="" />
          <span class="gt" style="--gr:0;--gb:13.4" data-notype data-flick
            ><button type="button" data-lang="en" aria-pressed="true">EN</button> - <button type="button" data-lang="es" aria-pressed="false">ES</button></span
          >
        </div>

        <!-- pager: the ring marks the page on screen and fills up as the autoplay runs -->
        <div class="grp ui__pager" style="--x:485;--y:451;--w:373;--h:34" data-pager>
          <span class="gt" style="--gx:0;--gb:23" data-i18n="lastNews">LAST NEWS:</span>
          <span class="ico ui__ring" style="--ix:98;--iy:0;--iw:34;--ih:34" data-ring aria-hidden="true">
            <img class="ui__ring-base" src="/media/icons/circle-stroke.svg" alt="" />
            <img class="ui__ring-fill" src="/media/icons/circle-stroke.svg" alt="" />
          </span>
          <button class="gt" type="button" style="--gx:110;--gb:23" data-page="0" aria-label="News, page 1" aria-current="true">1</button>
          <span class="gt gt--dash" style="--gx:137;--gb:23">--</span>
          <button class="gt" type="button" style="--gx:174;--gb:23" data-page="1" aria-label="News, page 2">2</button>
          <span class="gt gt--dash" style="--gx:201;--gb:23">--</span>
          <button class="gt" type="button" style="--gx:237;--gb:23" data-page="2" aria-label="News, page 3">3</button>
          <span class="gt gt--dash" style="--gx:264;--gb:23">--</span>
          <button class="gt" type="button" style="--gx:299;--gb:23" data-page="3" aria-label="News, page 4">4</button>
          <span class="gt gt--dash" style="--gx:327;--gb:23">--</span>
          <button class="gt" type="button" style="--gx:363;--gb:23" data-page="4" aria-label="News, page 5">5</button>
        </div>

        <p class="t" style="--x:485;--b:1050" data-flicker data-i18n="feature">Fashion feature</p>
        <p class="t" style="--x:1213;--b:1050" data-flicker data-i18n="tagline">Seven artists under 25 who refuse to be polished</p>

        <label class="grp ui__search" style="--x:30;--y:1026;--w:175;--h:24">
          <!-- hover: a REC light comes on and the text steps aside for it -->
          <span class="rec" aria-hidden="true"></span>
          <input class="gt" style="--gx:0;--gb:13.6" type="search" placeholder="Search" aria-label="Search" />
          <img class="ico" style="--ix:159;--iy:0;--iw:14;--ih:14" src="/media/icons/search.svg" alt="" />
          <img class="ico" style="--ix:0;--iy:21;--iw:175;--ih:3" src="/media/icons/line-search.svg" alt="" />
        </label>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
